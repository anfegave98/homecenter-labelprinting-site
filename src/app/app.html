<div class="min-h-screen flex flex-col bg-slate-50">
  <header class="bg-slate-900 text-white shadow-sm">
    <div class="mx-auto w-full max-w-6xl px-4 py-3 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <span class="inline-flex h-8 w-8 items-center justify-center rounded bg-emerald-500 font-bold text-slate-900">
          ETQ
        </span>
        <div class="leading-tight">
          <p class="font-semibold">Impresión de Etiquetas</p>
          <p class="text-xs text-slate-300">Homecenter · GTL Tienda</p>
        </div>
      </div>

      @if (auth.isAuthenticated()) {
        <div class="flex flex-wrap items-center gap-4">
          <nav class="flex items-center gap-1 text-sm">
            <a
              routerLink="/impresion"
              routerLinkActive="bg-slate-700"
              class="rounded px-3 py-1.5 transition hover:bg-slate-800"
            >
              Impresión
            </a>
          </nav>

          <div class="text-right leading-tight">
            <p class="text-sm font-medium">{{ auth.user()?.fullName }}</p>
            <p class="text-xs text-slate-300">{{ auth.roles().join(' · ') }}</p>
          </div>

          <button
            type="button"
            (click)="auth.logout()"
            class="rounded-lg border border-slate-600 px-3 py-1.5 text-sm transition hover:border-slate-400"
          >
            Salir
          </button>
        </div>
      }
    </div>
  </header>

  <main class="mx-auto w-full max-w-6xl flex-1 px-4 py-6">
    <router-outlet />
  </main>

  <footer class="border-t border-slate-200 bg-white">
    <div class="mx-auto w-full max-w-6xl px-4 py-3 text-xs text-slate-500">
      Submódulo de impresión de ETQ · Prueba técnica
    </div>
  </footer>
</div>
