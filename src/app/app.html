<div class="flex min-h-screen flex-col bg-hc-bg">
  <header class="bg-white shadow-[0_1px_2px_rgb(16_32_56/0.05)]">
    <div
      class="mx-auto flex w-full max-w-7xl flex-wrap items-center justify-between gap-4 border-b border-[#E3EAF2] px-4 py-3 sm:px-7"
    >
      <div class="flex flex-wrap items-center gap-4 sm:gap-6">
        <div class="flex items-center gap-3.5">
          <img
            src="/assets/brand/homecenter-logo.svg"
            alt="Homecenter Sodimac Corona"
            class="h-7 w-auto sm:h-[34px]"
          />
          <span class="hidden h-[30px] w-px bg-[#E3EAF2] sm:block"></span>
          <span class="hidden text-[15px] font-black leading-tight tracking-tight text-hc-ink sm:block">
            Impresión de Etiquetas
          </span>
        </div>

        @if (auth.isAuthenticated()) {
          <nav class="flex items-center gap-1 text-sm">
            <a
              routerLink="/impresion"
              routerLinkActive="bg-hc-blue-soft font-bold text-hc-blue"
              class="inline-flex h-[38px] items-center rounded-[9px] px-4 text-hc-muted transition hover:bg-hc-surface"
            >
              Impresión
            </a>
            <a
              routerLink="/historial"
              routerLinkActive="bg-hc-blue-soft font-bold text-hc-blue"
              class="inline-flex h-[38px] items-center rounded-[9px] px-4 text-hc-muted transition hover:bg-hc-surface"
            >
              Historial
            </a>
          </nav>
        }
      </div>

      @if (auth.isAuthenticated()) {
        <div class="flex items-center gap-3.5">
          <div class="hidden text-right leading-tight sm:block">
            <p class="text-sm font-bold text-hc-ink">{{ auth.user()?.fullName }}</p>
            <p class="text-[11px] font-bold uppercase tracking-wider text-hc-faint">
              {{ auth.roles().join(' · ') }}
            </p>
          </div>

          <span
            class="inline-flex h-[38px] w-[38px] items-center justify-center rounded-full bg-hc-yellow text-sm font-black text-hc-ink"
            aria-hidden="true"
          >
            {{ initials() }}
          </span>

          <button
            type="button"
            (click)="auth.logout()"
            class="h-[38px] rounded-[9px] border-[1.5px] border-hc-border px-4 text-[13px] font-bold text-hc-muted transition hover:border-hc-muted"
          >
            Salir
          </button>
        </div>
      }
    </div>

    <div class="hc-brandbar"></div>
  </header>

  <!--
    Columna flex para que una vista pueda ocupar el alto disponible y centrarse.
    Las demas siguen apilandose desde arriba: solo se centra la que lo pide.
  -->
  <main class="mx-auto flex w-full max-w-7xl flex-1 flex-col px-4 py-6 sm:px-7">
    <router-outlet />
  </main>

  <footer class="border-t border-[#E3EAF2] bg-white">
    <div class="mx-auto w-full max-w-7xl px-4 py-4 text-center text-xs text-hc-faint sm:px-7">
      Submódulo de impresión de ETQ · Prueba técnica
    </div>
  </footer>
</div>
