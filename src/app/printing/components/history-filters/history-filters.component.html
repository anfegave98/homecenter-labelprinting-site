<form
  [formGroup]="form"
  (ngSubmit)="submit()"
  class="rounded-lg border border-slate-200 bg-white p-4 shadow-sm"
>
  <h2 class="text-sm font-semibold text-slate-900">Filtros</h2>

  <div class="mt-3 grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
    <div>
      <label for="filterLpn" class="block text-sm font-medium text-slate-700">LPN</label>
      <input
        id="filterLpn"
        type="text"
        formControlName="lpn"
        placeholder="LPN-000987654"
        autocomplete="off"
        class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm
               focus:border-slate-500 focus:outline-none focus:ring-1 focus:ring-slate-500"
      />
    </div>

    <div>
      <label for="filterZone" class="block text-sm font-medium text-slate-700">Zona</label>
      <select
        id="filterZone"
        formControlName="zoneCode"
        class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm
               focus:border-slate-500 focus:outline-none focus:ring-1 focus:ring-slate-500"
      >
        <option value="">Todas</option>
        @for (zone of zones(); track zone.code) {
          <option [value]="zone.code">{{ zone.name }}</option>
        }
      </select>
    </div>

    @if (canFilterByUser()) {
      <div>
        <label for="filterUser" class="block text-sm font-medium text-slate-700">Usuario</label>
        <input
          id="filterUser"
          type="text"
          formControlName="userName"
          placeholder="operario.tienda"
          autocomplete="off"
          class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm
                 focus:border-slate-500 focus:outline-none focus:ring-1 focus:ring-slate-500"
        />
      </div>
    }

    <div>
      <label for="filterResult" class="block text-sm font-medium text-slate-700">Resultado</label>
      <select
        id="filterResult"
        formControlName="result"
        class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm
               focus:border-slate-500 focus:outline-none focus:ring-1 focus:ring-slate-500"
      >
        <option value="">Todos</option>
        <option value="APPROVED">Aprobada</option>
        <option value="REJECTED">Rechazada</option>
      </select>
    </div>

    <div>
      <label for="filterEvent" class="block text-sm font-medium text-slate-700">Tipo de evento</label>
      <select
        id="filterEvent"
        formControlName="eventType"
        class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm
               focus:border-slate-500 focus:outline-none focus:ring-1 focus:ring-slate-500"
      >
        <option value="">Todos</option>
        <option value="PRINT">Impresión</option>
        <option value="REPRINT">Reimpresión</option>
      </select>
    </div>

    <div class="grid grid-cols-2 gap-2">
      <div>
        <label for="filterFrom" class="block text-sm font-medium text-slate-700">Desde</label>
        <input
          id="filterFrom"
          type="date"
          formControlName="dateFrom"
          class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm
                 focus:border-slate-500 focus:outline-none focus:ring-1 focus:ring-slate-500"
        />
      </div>
      <div>
        <label for="filterTo" class="block text-sm font-medium text-slate-700">Hasta</label>
        <input
          id="filterTo"
          type="date"
          formControlName="dateTo"
          class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm
                 focus:border-slate-500 focus:outline-none focus:ring-1 focus:ring-slate-500"
        />
      </div>
    </div>
  </div>

  <div class="mt-4 flex flex-wrap gap-2">
    <button
      type="submit"
      [disabled]="disabled()"
      class="rounded-lg bg-slate-900 px-4 py-2 text-sm font-semibold text-white transition
             hover:bg-slate-800 disabled:cursor-not-allowed disabled:opacity-50"
    >
      Buscar
    </button>

    <button
      type="button"
      (click)="reset()"
      [disabled]="disabled()"
      class="rounded-lg border border-slate-300 px-4 py-2 text-sm font-medium text-slate-700 transition
             hover:border-slate-400 disabled:cursor-not-allowed disabled:opacity-50"
    >
      Limpiar
    </button>
  </div>
</form>
