<form
  [formGroup]="form"
  (ngSubmit)="submit()"
  class="hc-card p-5"
>
  <h2 class="m-0 text-[11px] font-bold uppercase tracking-[0.09em] text-hc-faint">Filtros</h2>

  <div class="mt-4 grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
    <div>
      <label for="filterLpn" class="hc-label">LPN</label>
      <input
        id="filterLpn"
        type="text"
        formControlName="lpn"
        placeholder="LPN-000987654"
        autocomplete="off"
        class="hc-input"
      />
    </div>

    <div>
      <label for="filterZone" class="hc-label">Zona</label>
      <select
        id="filterZone"
        formControlName="zoneCode"
        class="hc-input"
      >
        <option value="">Todas</option>
        @for (zone of zones(); track zone.code) {
          <option [value]="zone.code">{{ zone.name }}</option>
        }
      </select>
    </div>

    @if (canFilterByUser()) {
      <div>
        <label for="filterUser" class="hc-label">Usuario</label>
        <input
          id="filterUser"
          type="text"
          formControlName="userName"
          placeholder="operario.tienda"
          autocomplete="off"
          class="hc-input"
        />
      </div>
    }

    <div>
      <label for="filterResult" class="hc-label">Resultado</label>
      <select
        id="filterResult"
        formControlName="result"
        class="hc-input"
      >
        <option value="">Todos</option>
        <option value="APPROVED">Aprobada</option>
        <option value="REJECTED">Rechazada</option>
      </select>
    </div>

    <div>
      <label for="filterEvent" class="hc-label">Tipo de evento</label>
      <select
        id="filterEvent"
        formControlName="eventType"
        class="hc-input"
      >
        <option value="">Todos</option>
        <option value="PRINT">Impresión</option>
        <option value="REPRINT">Reimpresión</option>
      </select>
    </div>

    <div class="grid grid-cols-2 gap-2">
      <div>
        <label for="filterFrom" class="hc-label">Desde</label>
        <input
          id="filterFrom"
          type="date"
          formControlName="dateFrom"
          class="hc-input"
        />
      </div>
      <div>
        <label for="filterTo" class="hc-label">Hasta</label>
        <input
          id="filterTo"
          type="date"
          formControlName="dateTo"
          class="hc-input"
        />
      </div>
    </div>
  </div>

  <div class="mt-5 flex flex-wrap gap-2.5">
    <button
      type="submit"
      [disabled]="disabled()"
      class="h-11 rounded-[9px] bg-hc-blue px-6 text-sm font-bold text-white transition
             hover:bg-hc-blue-hover disabled:cursor-not-allowed disabled:opacity-50"
    >
      Buscar
    </button>

    <button
      type="button"
      (click)="reset()"
      [disabled]="disabled()"
      class="h-11 rounded-[9px] border-[1.5px] border-hc-border px-5 text-sm font-bold text-hc-muted transition
             hover:border-hc-muted disabled:cursor-not-allowed disabled:opacity-50"
    >
      Limpiar
    </button>
  </div>
</form>
