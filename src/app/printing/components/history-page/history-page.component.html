<section class="flex flex-col gap-5">
  <header class="flex flex-col gap-1">
    <h1 class="m-0 text-2xl font-black tracking-tight text-hc-blue-title">Historial de impresiones</h1>
    <p class="m-0 text-sm text-hc-muted">
      Trazabilidad de todas las solicitudes procesadas, aprobadas y rechazadas.
    </p>
  </header>

  <app-history-filters
    [zones]="printing.zones()"
    [canFilterByUser]="auth.canReprint()"
    [disabled]="history.loading()"
    (search)="search($event)"
    (clear)="clear()"
  />

  @if (scopeLabel(); as scope) {
    <p class="text-xs text-hc-faint">{{ scope }}</p>
  }

  @if (history.error(); as error) {
    <app-alert tone="error" title="No fue posible consultar el historial">
      {{ error.message }}
    </app-alert>
  }

  <div class="hc-card overflow-hidden">
    @if (history.loading()) {
      <div class="px-4 py-12">
        <app-brand-loader label="Consultando historial" [markSize]="58" />
      </div>
    } @else if (history.isEmpty()) {
      <div class="p-4">
        <app-empty-state
          title="Sin solicitudes registradas"
          description="No hay impresiones que cumplan los filtros aplicados."
        />
      </div>
    } @else {
      <app-history-table [items]="history.items()" />

      <app-pagination
        [page]="history.page()"
        [pageSize]="history.pageSize()"
        [total]="history.total()"
        [totalPages]="history.totalPages()"
        [disabled]="history.loading()"
        (pageChange)="goToPage($event)"
      />
    }
  </div>
</section>
