<div class="flex flex-col gap-5">
  <div class="flex flex-col gap-1">
    <h1 class="m-0 text-2xl font-black tracking-tight text-hc-blue-title">Imprimir etiqueta</h1>
    <p class="m-0 text-sm text-hc-muted">
      Consulta una ETQ/LPN pre-generada, verifica el documento y la disponibilidad por zona, y
      registra la impresión.
    </p>
  </div>

  <div class="grid items-start gap-5 lg:grid-cols-[minmax(0,24.5rem)_minmax(0,1fr)]">
    <section class="hc-card p-5">
      <app-print-form
        [zones]="printing.zones()"
        [userName]="auth.user()?.userName ?? ''"
        [requiresReprintReason]="printing.requiresReprintReason()"
        [canReprint]="auth.canReprint()"
        [hasLabel]="printing.label() !== null"
        [pendingDownload]="printing.pendingDownload()"
        [busy]="busy()"
        (resolveLabel)="resolve($event)"
        (submitPrint)="print($event)"
      />
    </section>

    <div class="flex flex-col gap-4">
      @if (printing.labelLoading()) {
        <div class="hc-card px-4 py-10">
          <app-brand-loader
            label="Consultando la etiqueta"
            detail="Resolviendo el documento origen y sus productos."
            [markSize]="58"
          />
        </div>
      }

      @if (printing.labelError(); as error) {
        <app-alert tone="error" [title]="'No fue posible resolver la etiqueta · ' + error.code">
          {{ error.message }}
        </app-alert>
      }

      @if (printing.label(); as label) {
        <app-label-preview [label]="label" />
      }

      <app-print-result
        [result]="printing.result()"
        [rejection]="printing.rejection()"
        [downloading]="printing.downloading()"
        [downloadError]="printing.downloadError()"
        (download)="printing.downloadLabel()"
      />

      @if (printing.printing()) {
        <div class="hc-card px-4 py-10">
          <app-brand-loader
            label="Estamos obteniendo los datos de tu operación"
            detail="Validando disponibilidad por zona y estado del documento."
            [markSize]="58"
          />
        </div>
      }
    </div>
  </div>
</div>
